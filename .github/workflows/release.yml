name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-15, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build standalone binary
        run: |
          bun build --compile --minify ./src/main.tsx \
            --outfile "dgtui-${{ matrix.target }}"

      - name: Package
        run: |
          tar -czf "dgtui-${{ matrix.target }}.tar.gz" "dgtui-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dgtui-${{ matrix.target }}
          path: "dgtui-${{ matrix.target }}.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
